name: Setup Go
description: Install Go from go.mod with optional cache

inputs:
  cache:
    description: Enable Go module cache
    required: false
    default: "true"
  go-version-file:
    description: Path to the go.mod file to read the Go version from
    required: false
    default: "go.mod"

runs:
  using: composite
  steps:
    - name: Setup Go from go.mod
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
