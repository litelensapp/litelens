name: Detect Path Changes

on:
  workflow_call:
    inputs:
      RUNNER:
        type: string
        required: false
        default: ubuntu-latest
      paths:
        description: "Newline-separated list of pathspecs to watch (git pathspec syntax, e.g. 'design-system/**')"
        type: string
        required: true
    outputs:
      changed:
        description: "'true' if any watched path changed since the previous pushed commit"
        value: ${{ jobs.detect.outputs.changed }}

jobs:
  detect:
    name: Detect Changes
    runs-on: ${{ inputs.RUNNER }}
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        env:
          PATHS: ${{ inputs.paths }}
          BEFORE: ${{ github.event.before }}
        run: |
          # All-zero SHA means first push to the branch (no prior commit to diff against) —
          # fail open so a legitimate first release isn't silently skipped.
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t pathspecs <<< "$PATHS"
          if git diff --quiet "$BEFORE" HEAD -- "${pathspecs[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
