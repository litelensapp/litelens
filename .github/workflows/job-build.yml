name: Build Desktop Application

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "dev"

jobs:
  run:
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: litelens-darwin-arm64.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: litelens-windows-amd64.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: litelens-linux-amd64.tar.gz
            build_flags: -tags webkit2_41

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go from go.mod
        uses: ./.github/actions/setup-go

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          ignore-scripts: "false"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build design-system
        run: pnpm build:ds

      - name: Build
        shell: bash
        run: >
          pnpm build:app --
          -platform ${{ matrix.platform }}
          ${{ matrix.build_flags }}
          -ldflags "-s -w -X main.Version=${{ inputs.version }}"

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: cd build/bin && zip -r ${{ matrix.artifact }} litelens.app

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          cp build/appicon.png build/bin/
          cd build/bin && tar -czf ${{ matrix.artifact }} litelens litelens-install-helper appicon.png

      - name: Rename binary (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: mv build/bin/litelens.exe build/bin/${{ matrix.artifact }}

      - name: Compute SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/bin
          shasum -a 256 "${{ matrix.artifact }}" | awk '{print $1}' > "${{ matrix.artifact }}.sha256"

      - name: Compute SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/bin
          $hash = Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}" | Select-Object -ExpandProperty Hash
          $hash | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/${{ matrix.artifact }}
            build/bin/${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload checksum artifact
        # Only consumed by publish-manifest below (to populate manifest.json's
        # sha256 field) — kept as a small dedicated artifact rather than
        # re-downloading the full build artifact just to read the checksum.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksum-${{ matrix.artifact }}
          path: build/bin/${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload to release
        if: ${{ inputs.version != 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.version }}" build/bin/${{ matrix.artifact }} --repo "${{ github.repository }}" --clobber

  publish-manifest:
    needs: run
    if: ${{ inputs.version != 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download checksum artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: checksum-*
          path: checksums
          merge-multiple: true

      - name: Build manifest.json from published release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          REPO="${{ github.repository }}"

          echo '{"version": "'"$TAG"'", "release_tag": "'"$TAG"'", "generated_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'", "artifacts": []}' > manifest.json

          # The release is still in draft state at this point in the pipeline
          # (finalize-release flips it to published later), and GitHub's
          # "get release by tag" endpoint only returns published releases —
          # so `gh release view`/`gh api releases/tags/<tag>` 404 on it.
          # List all releases instead (which does include drafts) and filter
          # by tag locally.
          release=$(gh api "repos/${REPO}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG}\")")

          # List all assets in the release (checksums are no longer published
          # as release assets — they're read from the checksum-* build
          # artifacts downloaded above instead).
          assets=$(echo "$release" | jq -r '.assets[].name')

          for artifact in $assets; do
            # Parse os/arch from filename: litelens-<os>-<arch>.<ext>
            # Regex: ^litelens-([a-z0-9]+)-([a-z0-9]+)\.
            if [[ $artifact =~ ^litelens-([a-z0-9]+)-([a-z0-9]+)\. ]]; then
              os="${BASH_REMATCH[1]}"
              arch="${BASH_REMATCH[2]}"
            else
              echo "::warning::skipping ${artifact}: does not match litelens-<os>-<arch>.<ext> pattern"
              continue
            fi

            sha256=""
            [[ -f "checksums/${artifact}.sha256" ]] && sha256=$(tr -d '[:space:]' < "checksums/${artifact}.sha256")
            size=$(echo "$release" | jq --arg name "$artifact" '.assets[] | select(.name == $name) | .size')
            if [[ -z "$sha256" || -z "$size" ]]; then
              echo "::warning::skipping ${artifact}: could not fetch checksum or size"
              continue
            fi
            manifest=$(jq --arg os "$os" --arg arch "$arch" --arg filename "$artifact" --arg sha256 "$sha256" --argjson size "$size" \
              '.artifacts += [{"os": $os, "arch": $arch, "filename": $filename, "sha256": $sha256, "size": $size}]' manifest.json)
            echo "$manifest" > manifest.json
          done

          cat manifest.json

      - name: Upload manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.version }}" manifest.json --repo "${{ github.repository }}" --clobber

  finalize-release:
    needs: [run, publish-manifest]
    if: ${{ inputs.version != 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Finalize release by flipping draft to published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.version }}" --repo "${{ github.repository }}" --draft=false

  publish-homebrew:
    name: Publish to Homebrew
    needs: [finalize-release]
    if: ${{ inputs.version != 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download and validate manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"

          mkdir -p manifest_dir
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "manifest.json" \
            --dir manifest_dir

          MANIFEST="manifest_dir/manifest.json"
          jq empty "$MANIFEST"

          ARTIFACT=$(jq -r '.artifacts[] | select(.os == "darwin" and .arch == "arm64") | .filename' "$MANIFEST")
          SHA256=$(jq -r '.artifacts[] | select(.os == "darwin" and .arch == "arm64") | .sha256' "$MANIFEST")

          [[ -n "$ARTIFACT" && -n "$SHA256" ]] || { echo "::error::darwin/arm64 entry missing from manifest"; exit 1; }
          [[ "$SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::malformed sha256 in manifest: $SHA256"; exit 1; }

          {
            echo "artifact=$ARTIFACT"
            echo "sha256=$SHA256"
            echo "version_no_v=${VERSION#v}"
          } >> "$GITHUB_ENV"

      - name: Verify artifact sha256 against downloaded binary
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION/${{ env.artifact }}"

          curl -fsSL -o /tmp/artifact "$DOWNLOAD_URL"
          COMPUTED=$(shasum -a 256 /tmp/artifact | awk '{print $1}')

          [[ "$COMPUTED" == "${{ env.sha256 }}" ]] || {
            echo "::error::sha256 mismatch — manifest: ${{ env.sha256 }}, downloaded: $COMPUTED"
            exit 1
          }

      - name: Checkout tap repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: litelensapp/homebrew-litelens
          token: ${{ secrets.HOMEBREW_TAP_PUBLISH_PAT }}
          path: tap_repo

      - name: Generate cask file
        run: |
          set -euo pipefail
          mkdir -p tap_repo/Casks

          # Plain (unquoted-var) shell substitution for VERSION/SHA256; the
          # Ruby `#{version}` interpolation has no leading $ so the shell
          # leaves it untouched regardless of quoting.
          VERSION_NO_V="${{ env.version_no_v }}"
          SHA256="${{ env.sha256 }}"

          cat > tap_repo/Casks/litelens.rb <<RUBY
          cask "litelens" do
            version "${VERSION_NO_V}"
            sha256 "${SHA256}"

            url "https://github.com/litelensapp/litelens/releases/download/v#{version}/litelens-darwin-arm64.zip"
            name "LiteLens"
            desc "Lightweight Kubernetes desktop dashboard"
            homepage "https://github.com/litelensapp/litelens"

            app "litelens.app"

            depends_on arch: :arm64

            caveats do
              <<~EOS
                macOS may show a "LiteLens is from an unidentified developer" warning on
                first launch (the app is ad-hoc signed, not notarized). To run it, open
                System Settings > Privacy & Security and click "Open Anyway" next to LiteLens.

                LiteLens has a built-in self-updater that Homebrew is not aware of. If you
                installed via Homebrew, prefer `brew upgrade litelens` to keep versions in sync.
              EOS
            end

            livecheck do
              url :url
              strategy :github_latest_release
              regex(/^v?(\d+(?:\.\d+)*)$/i)
            end
          end
          RUBY

      - name: Install Homebrew and audit cask
        run: |
          set -euo pipefail
          if ! command -v brew &> /dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew audit --strict tap_repo/Casks/litelens.rb

      - name: Commit and push to tap repository
        working-directory: tap_repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/litelens.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish litelens ${{ inputs.version }} to Homebrew"
            git push origin main
          else
            echo "No cask changes to publish."
          fi
