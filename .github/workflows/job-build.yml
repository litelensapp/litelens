name: Build Desktop Application

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "dev"

jobs:
  run:
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: litelens-darwin-arm64.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: litelens-windows-amd64.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: litelens-linux-amd64.tar.gz
            build_flags: -tags webkit2_41

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go from go.mod
        uses: ./.github/actions/setup-go

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          ignore-scripts: "false"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build design-system
        run: pnpm build:ds

      - name: Build
        shell: bash
        run: >
          pnpm build:app --
          -platform ${{ matrix.platform }}
          ${{ matrix.build_flags }}
          -ldflags "-s -w -X main.Version=${{ inputs.version }}"

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: cd build/bin && zip -r ${{ matrix.artifact }} litelens.app

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          cp build/appicon.png build/bin/
          cd build/bin && tar -czf ${{ matrix.artifact }} litelens litelens-install-helper appicon.png

      - name: Rename binary (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: mv build/bin/litelens.exe build/bin/${{ matrix.artifact }}

      - name: Compute SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/bin
          shasum -a 256 "${{ matrix.artifact }}" | awk '{print $1}' > "${{ matrix.artifact }}.sha256"

      - name: Compute SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/bin
          $hash = Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}" | Select-Object -ExpandProperty Hash
          $hash | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/${{ matrix.artifact }}
            build/bin/${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload to release
        if: ${{ inputs.version != 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.version }}" build/bin/${{ matrix.artifact }} --repo "${{ github.repository }}" --clobber
          gh release upload "${{ inputs.version }}" build/bin/${{ matrix.artifact }}.sha256 --repo "${{ github.repository }}" --clobber
